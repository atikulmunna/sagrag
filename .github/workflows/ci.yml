name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        # Only the lightweight import/runtime deps are needed for the unit
        # suite: torch/spacy/qdrant/elasticsearch/neo4j are imported lazily
        # inside functions and are not exercised here.
        run: pip install -e ".[test]"

      - name: Lint (ruff)
        run: |
          ruff check app tests
          ruff format --check tests

      - name: Type check (mypy)
        # Lenient baseline; informational while the codebase is untyped.
        run: mypy app
        continue-on-error: true

      - name: Unit tests
        run: pytest

      - name: Web app syntax check
        run: for f in web/js/*.js; do node --check "$f"; done

  docker:
    # Builds both images (no push) so Dockerfile and dependency breakage is
    # caught before a deploy.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend.Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
