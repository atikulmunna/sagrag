services:

  qdrant:
    image: qdrant/qdrant:v1.16.1
    container_name: infra-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: infra-elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  neo4j:
    image: neo4j:5.13
    container_name: infra-neo4j
    environment:
      # Must match NEO4J_PASSWORD in ../.env (the backend's). Compose reads
      # ${...} values from infra/.env or the shell, so set it there too.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme}
      # Keep the dev stack inside a small Docker VM (Neo4j otherwise sizes its
      # heap from all available memory).
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    ports:
      - "7474:7474"
      - "7687:7687"

  redis:
    image: redis:7
    container_name: infra-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ..
      dockerfile: backend.Dockerfile
    container_name: sag-backend
    env_file:
      - ../.env
    environment:
      # nginx in the web container is one trusted proxy hop. If you publish
      # port 8000 to untrusted clients, set this to 0 (they could spoof
      # X-Forwarded-For to dodge rate limits).
      - TRUSTED_PROXY_HOPS=1
    volumes:
      - ../data:/data
      - ${HF_CACHE_DIR:-./hf_cache}:/hf_cache
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
      - elastic
      - neo4j
      - redis

  web:
    build:
      context: ..
      dockerfile: web.Dockerfile
    container_name: sag-web
    ports:
      - "8080:8080"
    depends_on:
      - backend

  # Local LLM on an NVIDIA GPU, opt-in via: docker compose --profile llm up
  # Publishes 11434 on the host, so the backend's default
  # OLLAMA_URL=http://host.docker.internal:11434 reaches it unchanged.
  # Pull a model once: docker compose exec ollama ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama:0.40.6
    container_name: sag-ollama
    profiles: ["llm"]
    environment:
      # Keep the model in VRAM; reloading takes longer than the judge timeout.
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Observability stack, opt-in via: docker compose --profile observability up
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: sag-prometheus
    profiles: ["observability"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    container_name: sag-grafana
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: sag-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"

volumes:
  ollama:
